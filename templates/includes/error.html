{{ template "header.html" . }}
<div class="content-body p-4 text-center">
    <div style="max-width: 500px; margin: 60px auto; padding: 30px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff;">
        <i class="bi bi-shield-lock text-danger" style="font-size: 3rem;"></i>
        <h3 class="mt-3 text-danger fw-bold">{{ .Title }}</h3>
        <p class="text-secondary mt-2">{{ .Message }}</p>
        <a href="/" class="btn btn-primary mt-3"><i class="bi bi-house me-1"></i> Return to Dashboard</a>
    </div>
</div>
{{ template "footer.html" . }}
