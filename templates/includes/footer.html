        <footer class="app-footer">
            <div>
                &copy; 2026 KPRM2 - Background Verification &amp; Case Management Platform. All rights reserved.
            </div>
            <div>
                <span class="footer-credit">Engineered in Go (Golang)</span>
            </div>
        </footer>
    </div> <!-- end main-content -->
</div> <!-- end dashboard-layout -->

<!-- Case Stage Modal for Central Lifecycle View -->
<div class="modal fade" id="caseStageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fs-15 fw-bold" id="caseStageTitle">Case Audit &amp; Stage Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" id="caseStageBody">
                <div class="text-center py-4 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Loading case audit trail...
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function openCaseStageModal(caseId) {
    const modal = new bootstrap.Modal(document.getElementById('caseStageModal'));
    document.getElementById('caseStageTitle').innerText = 'Case #' + caseId + ' Lifecycle Stage';
    document.getElementById('caseStageBody').innerHTML = '<div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div> Fetching case tasks & audit matrix...</div>';
    modal.show();

    fetch('/api/case_stage/' + caseId)
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                document.getElementById('caseStageBody').innerHTML = '<div class="alert alert-danger">' + data.error + '</div>';
                return;
            }
            let html = '<div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-light rounded border">';
            html += '<div><strong>Client:</strong> ' + data.client_name + '</div>';
            html += '<div><strong>Case Outcome:</strong> ' + data.status_badge + '</div></div>';

            html += '<h6 class="fw-bold mb-2">Constituent Verification Tasks:</h6>';
            if (data.tasks && data.tasks.length > 0) {
                html += '<div class="list-group mb-3">';
                data.tasks.forEach(t => {
                    html += '<div class="list-group-item p-3">';
                    html += '<div class="d-flex justify-content-between align-items-center mb-1">';
                    html += '<span class="fw-bold text-dark">' + t.task_name + ' <span class="badge bg-secondary-subtle text-secondary ms-1">' + t.task_type + '</span></span>';
                    html += t.status_badge;
                    html += '</div>';
                    html += '<div class="small text-muted mb-2"><i class="bi bi-person me-1"></i> Verifier: <strong>' + t.verifier + '</strong></div>';
                    if (t.remarks) {
                        html += '<div class="p-2 bg-light rounded border small mb-2"><strong class="text-secondary">Remarks:</strong> ' + t.remarks + '</div>';
                    }
                    if (t.financial_table) {
                        html += '<div class="mt-2">' + t.financial_table + '</div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            } else {
                html += '<p class="text-muted">No tasks assigned to this case yet.</p>';
            }
            document.getElementById('caseStageBody').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('caseStageBody').innerHTML = '<div class="alert alert-danger">Failed to load case stage: ' + err + '</div>';
        });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
