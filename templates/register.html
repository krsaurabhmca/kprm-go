<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ if .Title }}{{ .Title }}{{ else }}Register - Structure Clone Wizard{{ end }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/custom_ui.css">
</head>
<body>
<div class="wizard-container wizard-card-xs">
    <div class="wizard-header mb-15">
        <h1 class="page-title">Register</h1>
        <p>Create an Account</p>
    </div>

    {{ if .Error }}
        <div class="alert alert-danger mb-1">
            {{ .Error }}
        </div>
    {{ end }}

    <form action="/register" method="POST">
        <input type="hidden" name="action" value="register">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>User Type (Role)</label>
            <select name="role_id" class="form-control" required>
                <option value="">-- Select Role --</option>
                {{ range .Roles }}
                    <option value="{{ .ID }}">{{ .RoleName }}</option>
                {{ end }}
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    
    <div class="text-center mt-15">
        <a href="/login" class="text-muted no-underline">Already have an account? Login</a>
    </div>
</div>
</body>
</html>
